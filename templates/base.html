<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack-City | Advanced Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top floating-navbar">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-truck-fast"></i> LOGITRACK
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" style="border-color: rgba(0, 212, 255, 0.5);">
            <i class="fa-solid fa-bars" style="color: var(--primary-blue);"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.path == '/' %}active{% endif %}" aria-current="page" href="/"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.path == '/about' %}active{% endif %}" href="/about"><i class="fa-solid fa-building me-1"></i> Tentang Kami</a>
                </li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                    <a class="nav-link btn-admin-nav text-dark {% if request.path == '/admin' %}active{% endif %}" href="/admin"><i class="fa-solid fa-shield-halved me-1"></i> Admin Panel</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    {% block content %}
    {% endblock %}
<footer class="py-4 text-center mt-5" style="border-top: 1px solid rgba(255,255,255,0.05);">
    <p class="mb-0 text-white small">&copy; 2026 LogiTrack City Logistics. Designed for Naufal Ahmad Fauzan.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const mapModal = document.getElementById('mapModal');
        const mapIframe = document.getElementById('mapIframe');
        const modalLocationName = document.getElementById('modalLocationName');

        if(mapModal) {
            mapModal.addEventListener('show.bs.modal', function (event) {
                // Get the button that triggered the modal
                const button = event.relatedTarget;
                // Extract info from data-location attribute
                const location = button.getAttribute('data-location');
                
                // Update the modal's content
                modalLocationName.textContent = location;
                
                // Use Google Maps Embed API (Free, no key needed for basic query)
                mapIframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(location)}&output=embed`;
            });

            // Clear iframe when modal is closed
            mapModal.addEventListener('hidden.bs.modal', function () {
                mapIframe.src = '';
            });
        }

        // SweetAlert2 Flash Messages
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: '{{ category if category != "error" else "error" }}',
                        title: '{{ message }}',
                        showConfirmButton: false,
                        timer: 3000,
                        timerProgressBar: true,
                        background: 'rgba(15, 20, 30, 0.95)',
                        color: '#fff',
                        customClass: {
                            popup: 'glass-card'
                        }
                    });
                {% endfor %}
            {% endif %}
        {% endwith %}
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
